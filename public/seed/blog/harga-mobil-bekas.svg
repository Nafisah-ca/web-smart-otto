<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Bar chart bars -->
  <rect x="100" y="300" width="70" height="100" rx="6" fill="#334155"/>
  <rect x="200" y="240" width="70" height="160" rx="6" fill="#475569"/>
  <rect x="300" y="180" width="70" height="220" rx="6" fill="#64748b"/>
  <rect x="400" y="210" width="70" height="190" rx="6" fill="#475569"/>
  <rect x="500" y="150" width="70" height="250" rx="6" fill="#e11d48"/>
  <rect x="600" y="260" width="70" height="140" rx="6" fill="#475569"/>
  <!-- Glow on tallest bar -->
  <rect x="500" y="150" width="70" height="250" rx="6" fill="#e11d48" opacity=".3" filter="url(#glow)"/>
  <!-- Trend line -->
  <polyline points="135,310 235,256 335,196 435,226 535,166 635,276"
            fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round"/>
  <!-- Trend dots -->
  <circle cx="135" cy="310" r="6" fill="#fbbf24"/>
  <circle cx="235" cy="256" r="6" fill="#fbbf24"/>
  <circle cx="335" cy="196" r="6" fill="#fbbf24"/>
  <circle cx="435" cy="226" r="6" fill="#fbbf24"/>
  <circle cx="535" cy="166" r="6" fill="#fbbf24"/>
  <circle cx="635" cy="276" r="6" fill="#fbbf24"/>
  <!-- Currency icon -->
  <circle cx="680" cy="90" r="50" fill="#e11d48" opacity=".15" stroke="#e11d48" stroke-width="2"/>
  <text x="680" y="100" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#e11d48" text-anchor="middle">Rp</text>
  <!-- Grid lines -->
  <line x1="85" y1="400" x2="715" y2="400" stroke="#1e293b" stroke-width="2"/>
  <line x1="85" y1="300" x2="715" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="85" y1="200" x2="715" y2="200" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="85" y1="140" x2="715" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,4"/>
  <!-- Label -->
  <rect x="0" y="0" width="200" height="40" fill="#e11d48"/>
  <text x="14" y="26" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="white">HARGA MOBIL BEKAS</text>
</svg>
