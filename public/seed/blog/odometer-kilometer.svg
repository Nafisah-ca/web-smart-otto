<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#111827"/>
  <!-- Speedometer outer ring -->
  <circle cx="400" cy="260" r="180" fill="#1f2937" stroke="#374151" stroke-width="4"/>
  <circle cx="400" cy="260" r="160" fill="#111827" stroke="#1f2937" stroke-width="2"/>
  <!-- Speed arc segments (colored) -->
  <path d="M 248 362 A 160 160 0 0 1 400 100" fill="none" stroke="#22c55e" stroke-width="18" stroke-linecap="round"/>
  <path d="M 400 100 A 160 160 0 0 1 520 148" fill="none" stroke="#fbbf24" stroke-width="18" stroke-linecap="round"/>
  <path d="M 520 148 A 160 160 0 0 1 552 362" fill="none" stroke="#e11d48" stroke-width="18" stroke-linecap="round"/>
  <!-- Tick marks -->
  <line x1="400" y1="105" x2="400" y2="125" stroke="#6b7280" stroke-width="3"/>
  <line x1="511" y1="143" x2="501" y2="160" stroke="#6b7280" stroke-width="3"/>
  <line x1="545" y1="265" x2="525" y2="265" stroke="#6b7280" stroke-width="3"/>
  <line x1="289" y1="143" x2="299" y2="160" stroke="#6b7280" stroke-width="3"/>
  <line x1="255" y1="265" x2="275" y2="265" stroke="#6b7280" stroke-width="3"/>
  <!-- Speed labels -->
  <text x="400" y="145" font-family="Arial,sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">100</text>
  <text x="490" y="180" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">140</text>
  <text x="295" y="180" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">60</text>
  <text x="250" y="290" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">20</text>
  <text x="530" y="290" font-family="Arial,sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">180</text>
  <!-- Needle pointing to 90 (normal range) -->
  <line x1="400" y1="260" x2="305" y2="145" stroke="#e11d48" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="260" r="18" fill="#374151" stroke="#e11d48" stroke-width="3"/>
  <circle cx="400" cy="260" r="7" fill="#e11d48"/>
  <!-- Odometer display -->
  <rect x="330" y="290" width="140" height="40" rx="6" fill="#0f172a" stroke="#374151" stroke-width="2"/>
  <text x="400" y="317" font-family="monospace" font-size="20" font-weight="700" fill="#4ade80" text-anchor="middle">087,432</text>
  <text x="400" y="355" font-family="Arial,sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">km</text>
  <!-- Label -->
  <rect x="0" y="0" width="240" height="40" fill="#e11d48"/>
  <text x="14" y="26" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="white">ODOMETER &amp; KILOMETER</text>
</svg>
