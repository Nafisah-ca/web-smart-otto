<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#fafafa"/>
  <!-- Checklist card -->
  <rect x="100" y="70" width="320" height="320" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Header -->
  <rect x="100" y="70" width="320" height="56" rx="20" fill="#e11d48"/>
  <rect x="100" y="106" width="320" height="20" fill="#e11d48"/>
  <text x="260" y="104" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">CHECKLIST PEMBELIAN</text>
  <!-- Checklist items -->
  <circle cx="138" cy="162" r="10" fill="#4ade80"/>
  <polyline points="132,162 137,168 145,155" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="156" width="130" height="12" rx="6" fill="#e2e8f0"/>

  <circle cx="138" cy="200" r="10" fill="#4ade80"/>
  <polyline points="132,200 137,206 145,193" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="194" width="160" height="12" rx="6" fill="#e2e8f0"/>

  <circle cx="138" cy="238" r="10" fill="#4ade80"/>
  <polyline points="132,238 137,244 145,231" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="158" y="232" width="110" height="12" rx="6" fill="#e2e8f0"/>

  <circle cx="138" cy="276" r="10" fill="#fbbf24"/>
  <text x="138" y="281" font-family="Arial,sans-serif" font-size="12" fill="white" text-anchor="middle">!</text>
  <rect x="158" y="270" width="145" height="12" rx="6" fill="#e2e8f0"/>

  <circle cx="138" cy="314" r="10" fill="#e11d48" opacity=".4"/>
  <line x1="133" y1="309" x2="143" y2="319" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="143" y1="309" x2="133" y2="319" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="158" y="308" width="120" height="12" rx="6" fill="#fee2e2"/>

  <!-- Inspector figure (right side) -->
  <!-- Head -->
  <circle cx="580" cy="130" r="40" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <!-- Helmet/cap -->
  <path d="M545 120 Q580 90 615 120" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="566" cy="132" r="5" fill="#1e293b"/>
  <circle cx="594" cy="132" r="5" fill="#1e293b"/>
  <!-- Body -->
  <rect x="548" y="172" width="64" height="90" rx="12" fill="#1e293b"/>
  <!-- Smart Otto badge on shirt -->
  <rect x="560" y="188" width="40" height="20" rx="4" fill="#e11d48"/>
  <text x="580" y="202" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">SO</text>
  <!-- Arms -->
  <line x1="548" y1="185" x2="510" y2="230" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <line x1="612" y1="185" x2="650" y2="230" stroke="#1e293b" stroke-width="16" stroke-linecap="round"/>
  <!-- Clipboard in hand -->
  <rect x="648" y="218" width="50" height="60" rx="6" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="658" y="230" width="30" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="658" y="242" width="24" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="658" y="254" width="28" height="6" rx="3" fill="#e2e8f0"/>
  <!-- Label -->
  <rect x="0" y="0" width="200" height="40" fill="#e11d48"/>
  <text x="14" y="26" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="white">TIPS BELI MOBIL BEKAS</text>
</svg>
