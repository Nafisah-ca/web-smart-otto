<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#f8fafc"/>
  <!-- Background cards shadow -->
  <rect x="300" y="135" width="260" height="190" rx="14" fill="#e2e8f0"/>
  <rect x="240" y="120" width="260" height="190" rx="14" fill="#cbd5e1"/>
  <!-- Main document card -->
  <rect x="180" y="105" width="260" height="200" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Document header accent -->
  <rect x="180" y="105" width="260" height="44" rx="14" fill="#e11d48"/>
  <rect x="180" y="129" width="260" height="20" fill="#e11d48"/>
  <text x="310" y="132" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">B P K B</text>
  <!-- Content lines -->
  <rect x="200" y="168" width="160" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="200" y="186" width="120" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="200" y="204" width="180" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="200" y="222" width="100" height="10" rx="5" fill="#e2e8f0"/>
  <!-- Stamp circle -->
  <circle cx="390" cy="240" r="30" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="390" y="246" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#e11d48" text-anchor="middle">SAH</text>
  <!-- STNK card -->
  <rect x="460" y="160" width="220" height="150" rx="14" fill="#1e3a5f" stroke="#334e7a" stroke-width="2"/>
  <rect x="460" y="160" width="220" height="44" rx="14" fill="#0f172a"/>
  <rect x="460" y="184" width="220" height="20" fill="#0f172a"/>
  <text x="570" y="187" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">S T N K</text>
  <rect x="480" y="220" width="120" height="8" rx="4" fill="#334e7a"/>
  <rect x="480" y="236" width="90" height="8" rx="4" fill="#334e7a"/>
  <rect x="480" y="252" width="140" height="8" rx="4" fill="#334e7a"/>
  <!-- Number plate -->
  <rect x="480" y="274" width="100" height="26" rx="5" fill="white" stroke="#475569" stroke-width="1.5"/>
  <text x="530" y="291" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">B 1234 ABC</text>
  <!-- Checklist overlay -->
  <circle cx="620" cy="80" r="38" fill="#4ade80" opacity=".15"/>
  <circle cx="620" cy="80" r="30" fill="#4ade80" opacity=".2"/>
  <polyline points="602,80 616,94 642,66" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Label -->
  <rect x="0" y="0" width="230" height="40" fill="#e11d48"/>
  <text x="14" y="26" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="white">CEK DOKUMEN KENDARAAN</text>
</svg>
