<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#1e293b"/>
  <rect x="0" y="320" width="800" height="130" fill="#0f172a"/>
  <!-- Road markings -->
  <rect x="80" y="378" width="60" height="8" rx="4" fill="#fbbf24" opacity=".5"/>
  <rect x="200" y="378" width="60" height="8" rx="4" fill="#fbbf24" opacity=".5"/>
  <rect x="320" y="378" width="60" height="8" rx="4" fill="#fbbf24" opacity=".5"/>
  <rect x="440" y="378" width="60" height="8" rx="4" fill="#fbbf24" opacity=".5"/>
  <rect x="560" y="378" width="60" height="8" rx="4" fill="#fbbf24" opacity=".5"/>
  <rect x="680" y="378" width="60" height="8" rx="4" fill="#fbbf24" opacity=".5"/>
  <!-- Car body -->
  <rect x="170" y="268" width="460" height="80" rx="12" fill="#e11d48"/>
  <!-- Roof -->
  <path d="M270 268 Q300 210 370 200 L430 200 Q500 210 530 268Z" fill="#be123c"/>
  <!-- Windows -->
  <rect x="285" y="218" width="90" height="46" rx="6" fill="#7dd3fc" opacity=".8"/>
  <rect x="385" y="218" width="100" height="46" rx="6" fill="#7dd3fc" opacity=".8"/>
  <!-- Wheels -->
  <circle cx="260" cy="348" r="42" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <circle cx="260" cy="348" r="24" fill="#374151"/>
  <circle cx="540" cy="348" r="42" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <circle cx="540" cy="348" r="24" fill="#374151"/>
  <!-- Headlight -->
  <ellipse cx="175" cy="295" rx="18" ry="12" fill="#fef08a" opacity=".9"/>
  <ellipse cx="625" cy="295" rx="18" ry="12" fill="#fef08a" opacity=".3"/>
  <!-- Magnify glass (inspect icon) -->
  <circle cx="620" cy="140" r="55" fill="none" stroke="#e11d48" stroke-width="8"/>
  <circle cx="620" cy="140" r="38" fill="#ffffff" opacity=".08"/>
  <line x1="660" y1="180" x2="700" y2="220" stroke="#e11d48" stroke-width="10" stroke-linecap="round"/>
  <!-- Checkmark inside lens -->
  <polyline points="596,140 614,158 648,124" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="2" fill="white" opacity=".6"/>
  <circle cx="200" cy="30" r="1.5" fill="white" opacity=".5"/>
  <circle cx="340" cy="80" r="2" fill="white" opacity=".4"/>
  <circle cx="700" cy="50" r="2.5" fill="white" opacity=".5"/>
  <circle cx="750" cy="100" r="1.5" fill="white" opacity=".6"/>
  <!-- Label strip -->
  <rect x="0" y="0" width="220" height="40" fill="#e11d48"/>
  <text x="14" y="26" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="white">INSPEKSI MOBIL BEKAS</text>
</svg>
